[Definition]
# Matches the IP and looks for 4xx (Client Error) or 5xx (Server Error) codes
#datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S,%%f
# Example log line: 1.2.3.4:12345 - "GET /admin HTTP/1.1" 404
#failregex = ^<HOST>.*"(GET|POST|PUT|DELETE|HEAD).*" (4\d{2}|5\d{2})
#failregex = ^INFO:\s+<HOST>:\d+ - ".*" (4\d{2}|5\d{2})
#failregex = ^<HOST>:[0-9]+ - "GET /.*" [45][0-9][0-9]
failregex = <HOST>:[0-9]+ - "(?:GET|HEAD|OPTIONS) /.*" [45][0-9][0-9]
ignoreregex =

